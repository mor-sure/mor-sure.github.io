name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro caches image transforms here. Without this every deploy re-encodes
      # every scan into AVIF, WebP and JPEG at two densities from scratch.
      - name: Cache image transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-

      # Kormelink's license permits serving it from the live site via
      # @font-face, but explicitly forbids uploading the font file to GitHub
      # — so it never enters the repo (see .gitignore) and is decoded from a
      # secret straight into place here instead. Skips cleanly if the secret
      # isn't set, so forks/PRs still build without it.
            - name: Add Kormelink font
        env:
          KORMELINK_WOFF2_BASE64: ${{ secrets.KORMELINK_WOFF2_BASE64 }}
          KORMELINK_ITALIC_WOFF2_BASE64: ${{ secrets.KORMELINK_ITALIC_WOFF2_BASE64 }}
        run: |
          mkdir -p public/fonts
          if [ -n "$KORMELINK_WOFF2_BASE64" ]; then
            echo "$KORMELINK_WOFF2_BASE64" | base64 -d > public/fonts/kormelink-roman.woff2
          fi
          if [ -n "$KORMELINK_ITALIC_WOFF2_BASE64" ]; then
            echo "$KORMELINK_ITALIC_WOFF2_BASE64" | base64 -d > public/fonts/kormelink-italic.woff2
          fi

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
